name: ${ATLAS_E2E_STACK:?Run bash tests/run-e2e.sh}

services:
  db:
    image: pgvector/pgvector:pg18
    labels:
      io.atlas.e2e-marker: ${ATLAS_E2E_MARKER:?Run bash tests/run-e2e.sh}
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_e2e
      TZ: Asia/Tokyo
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U atlas -d atlas_e2e"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    labels:
      io.atlas.e2e-marker: ${ATLAS_E2E_MARKER:?Run bash tests/run-e2e.sh}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    labels:
      io.atlas.e2e-marker: ${ATLAS_E2E_MARKER:?Run bash tests/run-e2e.sh}
    ports:
      - "127.0.0.1:${ATLAS_E2E_PORT:?Run bash tests/run-e2e.sh}:3000"
    environment:
      DATABASE_URL: postgres://atlas:atlas@db:5432/atlas_e2e
      MFA_ENCRYPTION_KEY_ID: ${MFA_ENCRYPTION_KEY_ID:?Run bash tests/run-e2e.sh}
      MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:?Run bash tests/run-e2e.sh}
      REDIS_URL: redis://redis:6379
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}
      LLM_ALLOWED_LOCAL_ORIGINS: ${LLM_ALLOWED_LOCAL_ORIGINS:-}
      WS_ALLOWED_ORIGINS: ${ATLAS_E2E_BASE:?Run bash tests/run-e2e.sh}
      AUTOMATION_WORKER_TOKEN: ${ATLAS_E2E_WORKER_TOKEN:?Run bash tests/run-e2e.sh}
      TZ: Asia/Tokyo
    volumes:
      - atlas-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  llm-mock:
    profiles: ["ai"]
    build: .
    command: ["node", "/fixtures/llm-mock.mjs"]
    labels:
      io.atlas.e2e-marker: ${ATLAS_E2E_MARKER:?Run bash tests/run-e2e.sh}
    volumes:
      - ./tests/fixtures/llm-mock.mjs:/fixtures/llm-mock.mjs:ro

volumes:
  atlas-uploads:

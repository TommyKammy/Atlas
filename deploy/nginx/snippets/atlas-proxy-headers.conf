# Shared proxy headers for Atlas.
#
# proxy_set_header is inherited only when the current level defines none, so
# every Atlas location includes this snippet and then overrides only the
# headers it needs (for example Connection/Upgrade on /api/ws).

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# HTTP/1.1 keep-alive to the upstream. NGINX 1.29.7+ also defaults to this, but
# stating it keeps 1.30.x and 1.31.x behavior identical and explicit.
proxy_set_header Connection        "";

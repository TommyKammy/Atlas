# Atlas production reverse proxy (NGINX stable 1.30.x / mainline 1.31.x).
#
# Install this file as an http-context include, for example:
#   /etc/nginx/conf.d/atlas.conf
# and install snippets/atlas-proxy-headers.conf as:
#   /etc/nginx/snippets/atlas-proxy-headers.conf
#
# Values to replace for your host:
#   - atlas.example.com                          (two server_name lines)
#   - /etc/letsencrypt/live/atlas.example.com/   (certificate paths)
#   - 127.0.0.1:3000                             (Atlas custom server address)
#   - /var/www/atlas-acme                        (certbot webroot)
#
# Keep this file free of X-Content-Type-Options, Referrer-Policy,
# X-Frame-Options, Permissions-Policy and Content-Security-Policy: Atlas sets
# them itself. NGINX owns only HSTS.

upstream atlas_app {
    # Replace with the address of the Atlas custom server (server.js).
    server 127.0.0.1:3000;

    # Keep idle upstream connections for 60s. Atlas defaults
    # ATLAS_KEEPALIVE_TIMEOUT_MS to 65000, so Node closes a socket only after
    # NGINX has already retired it. Do not make this longer than Atlas.
    keepalive 16;
    keepalive_timeout 60s;
}

# Port 80: ACME HTTP-01 challenge, then redirect everything else to HTTPS.
server {
    listen 80;
    server_name atlas.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/atlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name atlas.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/atlas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:atlas_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Atlas deliberately does not send HSTS itself; this is the only copy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Atlas accepts a 25 MiB file (app/api/attachments/route.ts). The multipart
    # envelope (boundaries, part headers and the task_id field) needs a little
    # room; 26m leaves about 1 MiB of headroom while still bounding the request
    # before it reaches Node. Atlas enforces the exact 25 MiB file limit.
    client_max_body_size 26m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # Text formats only; do not compress images, fonts or already-compressed data.
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_redirect off;

    # Streaming uploads: do not buffer a 25 MiB body to NGINX's temporary disk
    # before forwarding it. client_max_body_size still rejects oversized
    # requests, and Atlas still streams the file to its own staging file.
    location = /api/attachments {
        include snippets/atlas-proxy-headers.conf;
        proxy_request_buffering off;
        proxy_pass http://atlas_app;
    }

    # The live channel upgrades to WebSocket. Connection must be overridden
    # after the shared header snippet, which clears it for ordinary requests.
    location = /api/ws {
        include snippets/atlas-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://atlas_app;
    }

    location / {
        include snippets/atlas-proxy-headers.conf;
        proxy_pass http://atlas_app;
    }
}
